# ============================================================================
# THE GAUNTLET — frozen gate registry
# ============================================================================
# This file is the single authoritative definition of every gate. The scorecard
# in GAUNTLET.md is GENERATED from this file plus harness output; it is never
# hand-written. Editing a target here is a re-scope under §0.4 and requires an
# ADR. HARD gates may never be re-scoped downward.
#
# Fields:
#   stage       G0..G6
#   title       human name
#   metric      what is measured, in words
#   target      numeric target (or true for boolean gates)
#   cmp         comparator applied as: measured <cmp> target  => PASS
#               one of >=, <=, >, <, ==
#   unit        unit of the measured value
#   type        HARD | SOFT
#   klass       A | S | A+S
#   perf        true if a §6 "perf gate" (waiver-capped)
#   timing      true if a timing gate (§0.4 5% tolerance instead of 2%)
#   harness     argv executed to measure; must print one JSON object on stdout
#   entry       gate IDs that must be CLEAR before work on this gate begins
# ============================================================================

