[package]
name = "undo-property"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The in-process property harness G1.3 invokes as target/release/undo-property.
# It exercises ltx-core directly (no CLI), which is why it lives in its own crate
# rather than as a bin in ltx-core (whose only tempfile use is dev-only).

[dependencies]
ltx-core = { path = "../ltx-core" }
serde_json.workspace = true
tempfile.workspace = true
