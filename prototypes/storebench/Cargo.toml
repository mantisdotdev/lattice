[package]
name = "storebench"
version = "0.0.0"
edition = "2021"
publish = false
description = "ADR-3 prototype: store backend candidates under Lattice's actual access patterns. Never imported by product crates."

[dependencies]
redb = "2.2"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
