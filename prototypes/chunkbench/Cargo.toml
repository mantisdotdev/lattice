[package]
name = "chunkbench"
version = "0.0.0"
edition = "2021"
publish = false
description = "ADR-2 prototype: FastCDC parameter sweep against real corpora. Never imported by product crates."

[dependencies]
fastcdc = "3.2"
blake3 = "1.5"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
