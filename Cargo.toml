[workspace]
resolver = "2"
members = ["crates/ltx-core", "crates/ltx", "crates/ltx-daemon", "crates/undo-property"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 stabilised `File::lock`/`try_lock`/`unlock`, which ADR-6 uses to give a
# repository an exclusive lock without adding a dependency for it. Raised
# deliberately: the alternative was a third-party locking crate, and a version
# floor is the cheaper of the two costs. CI pins 1.96 (rust-toolchain.toml);
# this is the floor the code actually needs, not the toolchain it is built with.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mantisdotdev/lattice"

[workspace.dependencies]
blake3 = "1.5"
fastcdc = "3.2"
# `std` for the `io::Error: From<getrandom::Error>` conversion: a failure to
# read entropy is an OS failure and is reported as one.
getrandom = { version = "0.4", features = ["std"] }
zstd = "0.13"
redb = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
