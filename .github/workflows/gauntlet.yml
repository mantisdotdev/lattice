name: gauntlet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-integrity:
    name: harness integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Every harness compiles
        run: python3 -m compileall -q harness scripts

      - name: Gate registry parses and is complete
        run: python3 harness/lib/validate_registry.py

      # §0.3 anti-gaming: no product code may detect or special-case harness
      # execution. This is grep-able by construction, so we grep for it.
      - name: No harness identifiers inside ltx-core (§0.3)
        run: python3 harness/lib/check_no_harness_leak.py

      - name: Scorecard is generated, not hand-written
        run: python3 harness/lib/check_scorecard_integrity.py

      - name: ADRs cite evidence that exists and agrees with them
        run: python3 harness/lib/check_adr_evidence.py

  measure:
    # CI measures ONLY the gates whose inputs live in the repository. The
    # corpus-dependent gates (G0.3, G0.4, G0.5, G0.7) read multi-gigabyte
    # corpora that are deliberately not committed, so measuring them here would
    # report a FAIL that means "the corpus is not in this checkout" rather than
    # "the gate does not hold". The scorecard of record is produced on the
    # reference environment in bench/ENVIRONMENT.md; this job is a smoke test
    # that the harnesses still run.
    name: measure repo-only gates (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Measure gates whose inputs are committed
        env:
          GAUNTLET_HARNESS_TIMEOUT: '900'
        run: |
          python3 scripts/gauntlet measure G0.1 G0.2 G0.6 G0.8 --no-ratchet-update
          python3 scripts/gauntlet scorecard
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: bench/results/
